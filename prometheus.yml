# prometheus.yml
# Konfigurasi Prometheus untuk monitoring sistem ML Titanic
# Cara pakai: prometheus --config.file=prometheus.yml

global:
  scrape_interval:     15s   # Ambil metrics setiap 15 detik
  evaluation_interval: 15s   # Evaluasi rules setiap 15 detik
  scrape_timeout:      10s

# ─────────────────────────────────────────────
# ALERTING (opsional — siapkan Alertmanager)
# ─────────────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# ─────────────────────────────────────────────
# SCRAPE JOBS
# ─────────────────────────────────────────────
scrape_configs:

  # 1. Prometheus itu sendiri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Inference server Flask (inference.py di port 5001)
  - job_name: 'ml_inference_server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5001']
    scrape_interval: 10s

  # 3. Custom ML exporter (prometheus_exporter.py di port 8000)
  - job_name: 'ml_custom_exporter'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 10s
