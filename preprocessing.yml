name: Preprocessing Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'titanic_raw/**'
      - 'preprocessing/automate_NamaSiswa.py'
  workflow_dispatch:   # trigger manual dari GitHub UI

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn seaborn matplotlib

      - name: Run Preprocessing Script
        run: |
          cd preprocessing
          python automate_NamaSiswa.py

      - name: Commit & Push Preprocessed Dataset
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add titanic_preprocessing/
          git diff --cached --quiet || git commit -m "chore: update preprocessed dataset [skip ci]"
          git push
