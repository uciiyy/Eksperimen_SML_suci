name: MLflow CI Training

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah estimator (pohon)'
        required: false
        default: '100'
      max_depth:
        description: 'Kedalaman maksimum pohon'
        required: false
        default: '5'
      min_samples_split:
        description: 'Min samples untuk split'
        required: false
        default: '2'

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install mlflow==2.18.0 pandas numpy scikit-learn matplotlib

      - name: Run MLflow Project
        working-directory: MLProject
        run: >
          mlflow run .
          --experiment-name "Titanic_CI_Pipeline"
          -P n_estimators=${{ github.event.inputs.n_estimators || '100' }}
          -P max_depth=${{ github.event.inputs.max_depth || '5' }}
          -P min_samples_split=${{ github.event.inputs.min_samples_split || '2' }}
          -P test_size=0.2
          --env-manager=local

      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: |
            MLProject/mlruns/
            MLProject/confusion_matrix.png
            MLProject/feature_importance.png
            MLProject/classification_report.txt
          retention-days: 30

      - name: Commit MLflow Results
        working-directory: MLProject
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add confusion_matrix.png feature_importance.png classification_report.txt || true
          git diff --cached --quiet || git commit -m "ci: save mlflow artifacts run #${{ github.run_number }} [skip ci]"
          git push origin main